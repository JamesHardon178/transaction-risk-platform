name: CI

# 触发：推 main、对 main 的 PR、手动运行
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的新提交会取消上一次未完成的运行，省额度也避免旧结果干扰
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: 静态检查（ruff）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装 ruff
        run: python -m pip install --upgrade pip ruff==0.17.5

      # 规则集与 pyproject.toml 的 [tool.ruff.lint] 一致：E4/E7/E9/F
      - name: 运行 ruff
        run: ruff check --output-format=github --statistics .

  compile:
    name: 编译校验（compileall）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 只做语法级校验，不导入任何依赖：可在零安装状态下秒级完成
      - name: 编译全部源码
        run: python -m compileall -q src app scripts tests

  test:
    name: 单元测试（跳过依赖非公开数据的 test_app）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: 安装测试依赖
        run: python -m pip install --upgrade pip -r requirements-test.txt

      # test_app.py 读取 data/processed/transactions_clean.parquet 与预测文件，
      # 二者按 .gitignore 不入库（体积大且含原始交易字段），故此处显式跳过；
      # 本地有数据时直接 pytest 即可跑满 58 项。
      - name: 运行 pytest
        run: python -m pytest -q --ignore=tests/test_app.py
